name: Publish official Lotto results

on:
  schedule:
    - cron: '0 6 * * 0,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-lotto-results
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Import official results
        id: update
        run: npm run update:data
      - name: Validate all tests before publishing
        run: npm test
      - name: Commit changed history and import status only
        if: success() && steps.update.outcome == 'success'
        run: |
          git add -- historical_data.json data-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: update official Lotto results and import status' -- historical_data.json data-status.json
          git push
      - name: Stage validated public site
        run: |
          mkdir -p "$RUNNER_TEMP/lotto-pages"
          cp -- index.html style.css script.js optimizer.js advanced_ml_model.js \
            generation.worker.js backtest.worker.js prize-engine.js prize-optimizer.js \
            backtester.js jev-config.js jev-client.js historical_data.json data-status.json "$RUNNER_TEMP/lotto-pages/"
      - name: Upload validated GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/lotto-pages

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy validated site and data snapshots
        id: deployment
        uses: actions/deploy-pages@v4
