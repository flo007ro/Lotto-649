name: Publish official Lotto results

on:
  schedule:
    - cron: '0 6 * * 0,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-lotto-results
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Import official results
        id: update
        continue-on-error: true
        run: npm run update:data
      - name: Validate all tests before publishing
        run: npm test
      - name: Commit changed history and import status only
        run: |
          git add -- historical_data.json data-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: update official Lotto results and import status' -- historical_data.json data-status.json
          git push
      - name: Report an unsuccessful import after preserving its status
        if: steps.update.outcome == 'failure'
        run: exit 1
